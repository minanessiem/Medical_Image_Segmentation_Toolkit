# Base cluster environment config (no diffusion or logging pairing)

defaults:
  - _self_
  - environment: isles_cluster
  - distribution: ddp
  - model: medsegdiff_256_4l_32c_6x4a_128t_1btl_medium_simple
  - data_profile: isles24_2d_online_baseline
  - data_runtime: ddp_cluster
  - augmentation: none
  - training: train_100Kms_50Ks_9999e
  - optimizer: adamw_2e4lr_wd00
  - scheduler: warmup_cosine_10pct
  - logging: default
  - loss: mse_loss_only
  - diffusion: openai_ddpm_100ts_debug
  - validation: default
  - inference: direct_model_space
  - inference_runtime: native

random_seed: 42
mode: train

timestamp: null
run_name: null

hydra:
  run:
    dir: '.'
