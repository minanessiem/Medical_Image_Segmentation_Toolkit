# @package _global_
#
# ISLES26 ATLAS30 conversion preset (cluster environment, T1 raw modality,
# 3D volumes, val_full export).
# Canonical usage:
#   python3 -m scripts.nnunet.convert_to_nnunet \
#       --config-name=nnunet/convert/isles26_atlas30_cluster_3d_t1raw

defaults:
  - cluster
  - /environment: isles26_atlas30_cluster
  - /data_profile: isles26_atlas30_3d_fullvol_t1raw
  - _self_

dataset:
  active_subsets:
    train: train
    val: val_full
    sample: val_full

nnunet:
  export_space: model_preprocessed
