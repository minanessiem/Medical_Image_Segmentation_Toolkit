# @package _global_
#
# ISLES24 conversion preset (cluster environment, baseline modalities, 3D volumes, full validation export).
# Canonical usage:
#   python3 -m scripts.nnunet.convert_to_nnunet \
#       --config-name=nnunet/convert/isles24_cluster_3d_baseline

defaults:
  - cluster
  - /environment: isles_cluster
  - /data_profile: isles24_3d_fullvol_baseline
  - _self_

dataset:
  active_subsets:
    train: train
    val: val
    sample: val

nnunet:
  export_space: native_input
