profile: gc_container_test
case_batch_size: 1
num_workers: 0
require_cuda: true
timeout_seconds: 600

constraints:
  allowed_output_spaces:
    - model_preprocessed
    - native_input
  allowed_precisions:
    - fp16
    - fp32
  allow_ground_truth: true
  allow_threshold_sweep: true
  allow_intermediate_artifacts: true
